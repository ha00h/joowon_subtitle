name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.2'
          cache: true

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v',''
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --build-name=${{ steps.version.outputs.version }} --build-number=1

      - name: Package zip
        shell: pwsh
        run: |
          $zip = "joowon-subtitle-${{ steps.version.outputs.version }}-windows.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $zip
          echo "ZIP_NAME=$zip" >> $env:GITHUB_ENV

      - uses: softprops/action-gh-release@v2
        with:
          name: Joowon Subtitle ${{ steps.version.outputs.tag }}
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
